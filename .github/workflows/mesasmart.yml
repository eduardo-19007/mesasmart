name: MesaSmart verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesasmart-app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesasmart_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: mesasmart_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mesasmart_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mesasmart_test:isolated-ci-only@localhost:5432/mesasmart_test
      AUTH_SESSION_SECRET: ci-only-auth-secret-not-for-production-42851
      QR_SIGNING_SECRET: ci-only-qr-secret-not-for-production-42851
      RESTAURANT_SLUG: miraflores
      DEMO_MODE: 'false'
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:ml
      - run: pnpm build
      - run: pnpm db:migrate
      - run: |
          mkdir -p qa
          pnpm start > qa/ci-server.log 2>&1 &
          node --input-type=module -e "for(let n=0;n<45;n++){try{if((await fetch('http://localhost:3000/api/health')).ok)process.exit(0)}catch{} await new Promise(r=>setTimeout(r,1000));}process.exit(1)"
      - run: pnpm test:integration
      - run: node scripts/review-probes.mjs
      - run: node scripts/audit-offset-prices.mjs
      - run: node scripts/release-manifest.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesasmart-verification
          path: mesasmart-app/qa
